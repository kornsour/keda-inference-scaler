# The custom external scaler itself (built by CI -> ghcr). KEDA dials it over gRPC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-scaler
  namespace: inference
  labels:
    app: inference-scaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-scaler
  template:
    metadata:
      labels:
        app: inference-scaler
    spec:
      containers:
        - name: scaler
          image: ghcr.io/kornsour/keda-inference-scaler:latest   # produced by .github/workflows/ci.yml
          ports:
            - name: grpc
              containerPort: 6000
            - name: http
              containerPort: 8080
          # /healthz is process liveness only (no Prometheus dependency), so
          # a wedged process gets restarted without the scaler's ability to
          # reach Prometheus flapping the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # /readyz additionally fails once the configured Prometheus hasn't
          # answered successfully within the readiness window (READY_WINDOW,
          # default 2m) -- see internal/observability. That takes the pod out
          # of the Service (and so out of KEDA's view) without restarting it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-scaler
  namespace: inference
spec:
  selector:
    app: inference-scaler
  ports:
    - name: grpc
      port: 6000
      targetPort: 6000
    - name: http
      port: 8080
      targetPort: 8080
