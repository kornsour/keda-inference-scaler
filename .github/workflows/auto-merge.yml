name: Auto-merge

# Turns on GitHub auto-merge (squash) for every non-draft, same-repository PR
# that Dependabot did not open. GitHub still holds the PR until main's required
# status checks pass; a red check never merges. Fork PRs are never auto-merged,
# and Dependabot PRs stay with dependabot-auto-merge.yml.
# See lurking-walrus/gh-automation README, "auto-merge.yml".

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: lurking-walrus/gh-automation/.github/workflows/auto-merge.yml@9755c5a968c76d19c7f54017d4bcd1b314810426 # main 2026-11-26
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
